models:
  - name: stg_bbc_sport__match_actions
    description: Actions players performed during a match.
    columns:
      - name: match_id
        description: BBC's short match ID. Foreign key.
        data_tests:
          - not_null
      - name: team_urn
        data_tests:
          - not_null
      - name: player_urn
        data_tests:
          - not_null
      - name: action_index
      - name: sub_index
      - name: is_own_goal
      - name: is_goal
      - name: is_direct_red
      - name: is_second_yellow
      - name: is_penalty
      - name: regulation_time_minutes
      - name: injury_time_minutes
      - name: period
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
