models:
  - name: stg_bbc_sport__match_officials
    description: Officials assigned to a match.
    data_tests:
      # An official is assigned to a match only 1 time
      - unique:
          column_name: "match_id || '|' || urn"
    columns:
      - name: match_id
        description: BBC's short match ID. Foreign key.
        data_tests:
          - not_null
      - name: match_urn
        data_tests:
          - not_null
      - name: urn
        data_tests:
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
