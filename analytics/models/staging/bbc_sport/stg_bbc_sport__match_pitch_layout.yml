models:
  - name: stg_bbc_sport__match_pitch_layout
    description: Player's position in the formation at the start of a match.
    data_tests:
      # A player is only in 1 position in the starting formation
      - unique:
          column_name: "match_id || '|' || player_urn"
    columns:
      - name: match_id
        description: BBC's short match ID. Foreign key.
        data_tests:
          - not_null
      - name: match_urn
        data_tests:
          - not_null
      - name: player_urn
        data_tests:
          - not_null
      - name: row_index
        data_tests:
          - not_null
      - name: slot_index
        data_tests:
          - not_null
